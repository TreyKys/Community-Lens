name: Cron — Social Reply Scan

# Reads monitored accounts and pushes reply drafts to Telegram.
#
# SCHEDULE DELIBERATELY DISABLED — manual trigger only.
#
# Reply discovery moved to share-to-bot: you send a post to the Telegram
# bot and it drafts a reply, for free. This scanner is the old metered
# route, where each billable target poll costs $0.025 (X's 5-result
# floor on the timeline endpoint) — roughly $3.65/month at two scans a
# day, which on a $5 budget is most of the money.
#
# With discovery manual, that entire budget goes to posts instead: ~333
# posts/month at $0.015 each, versus ~110 with scanning switched on.
#
# The scanner is kept, not deleted, because it is a working
# implementation and the trade flips if the budget grows. To bring it
# back: restore the schedule below, and set social_targets.active = true
# for the accounts you want watched (all six ship inactive).
#
#   schedule:
#     - cron: '0 11 * * *'
#     - cron: '30 17 * * *'

on:
  workflow_dispatch:

concurrency:
  group: cron-social-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan targets and draft replies
        run: |
          curl -sSf --max-time 290 -X POST "${{ secrets.API_BASE_URL }}/api/social/scan" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
