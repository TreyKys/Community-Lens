name: Cron — Social Plan

# SCHEDULE DELIBERATELY DISABLED — manual trigger only.
#
# This built the day's post queue and scheduled each one for the X API
# to auto-publish at a fixed time. That whole model — scheduled,
# unattended, posted via the metered API — is superseded by
# cron-social-digest.yml: the operator now posts everything themselves,
# which is also what makes the pipeline free (nothing here calls X's
# metered API at all, so there is nothing to budget or get developer
# keys for).
#
# This route is kept, not deleted, because it is a working
# implementation and the trade flips back if X posting is ever worth
# automating again — e.g. once there is real distribution and the
# metered cost is worth paying for guaranteed timing. To bring it back:
# restore the schedule below AND cron-social-publish.yml's.
#
#   schedule:
#     - cron: '0 5 * * *'

on:
  workflow_dispatch:

concurrency:
  group: cron-social-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Build today's social queue
        run: |
          curl -sSf --max-time 290 -X POST "${{ secrets.API_BASE_URL }}/api/social/plan" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
