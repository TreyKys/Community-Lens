name: Cron — Market Open Scheduled

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-market-open-scheduled
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open due scheduled markets
        run: |
          curl -sSf -X POST "${{ secrets.API_BASE_URL }}/api/markets/open-scheduled" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
