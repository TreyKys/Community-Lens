name: Cron — Squad Deposit Reconcile

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-squad-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Re-verify and credit stuck Squad deposits
        run: |
          curl -sSf -X POST "${{ secrets.API_BASE_URL }}/api/squad/reconcile" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
